name: Tests

on:
  workflow_dispatch: {}
  push:
    branches: [master, revival]
  pull_request:
    branches: [master]

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install dependencies
      run: uv sync --locked --all-extras

    - name: Lint
      run: uv run ruff check .

    - name: Tests
      run: uv run pytest -vvv --cov=src --cov-report=term-missing

  e2e:
    name: End to end
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install dependencies
      run: uv sync --locked --all-extras --group e2e

    # --with-deps: the runner has none of the shared libraries chromium wants.
    - name: Install chromium
      run: uv run playwright install --with-deps chromium

    - name: Browser tests
      run: uv run pytest tests/e2e -vvv

    - name: Keep the failures
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces
        path: test-results/
        if-no-files-found: ignore
