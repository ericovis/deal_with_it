# Fully-qualified image names: Podman will not guess a registry.
services:

  redis:
    image: docker.io/library/redis:7-alpine
    # Jobs and results are ephemeral, so no persistence. maxmemory with
    # noeviction makes a flood fail loudly (enqueue errors) instead of
    # evicting queued jobs or swapping the host.
    command: redis-server --save "" --appendonly no --maxmemory 1gb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      # Localhost only: no password on this Redis.
      - "127.0.0.1:6379:6379"

  web:
    build:
      context: .
      target: dev
    command: uvicorn src.app:app --reload --host 0.0.0.0 --port 5000
    environment:
      DWI_REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: dev
    # No reloader: restart after editing the task or processors.
    command: python -m src.worker
    environment:
      DWI_REDIS_URL: redis://redis:6379/0
      # Detection is single-threaded; one process per core. See docs/LOAD.md.
      DWI_WORKER_PROCESSES: 2
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
