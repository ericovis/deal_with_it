# Fully-qualified image names on purpose: Podman refuses to guess a registry
# for a short name, and this file has to work for both engines.
services:

  redis:
    image: docker.io/library/redis:7-alpine
    # Nothing here is worth persisting -- jobs and results are ephemeral, and
    # a disk-backed queue would just be a slower one.
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      target: dev
    command: uvicorn src.app:app --reload --host 0.0.0.0 --port 5000
    environment:
      DWI_REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: dev
    command: python -m src.worker
    environment:
      DWI_REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
