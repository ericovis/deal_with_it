[project]
name = "deal-with-it"
version = "1.0.0"
description = 'A Python API for creating "Deal With It"-like images'
readme = "README.md"
license = "MIT"
authors = [{ name = "Eric Magalhães", email = "eric@plytz.com" }]
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.118",
    "python-fasthtml>=0.14",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "rq>=2.6",
    "redis>=5.2,!=6.*",
    "requests>=2.32",
    "pillow>=11",
    "numpy>=2",
    # face_recognition_models imports pkg_resources, which setuptools 82 removed.
    "setuptools>=80,<82",
]

[project.optional-dependencies]
# The worker's business only; the web tier never imports it.
worker = [
    # YuNet face detection (src/models/*.onnx) runs on OpenCV's DNN module.
    "opencv-python-headless>=4.10",
    # dlib's 68-point shape predictor places the glasses; the model file
    # comes from face_recognition_models. Prebuilt wheel: no compiler.
    "dlib-bin==20.0.1",
    "face-recognition-models>=0.3",
    # Rasterises glasses.svg. Statically linked, so no apt layer.
    "resvg-py>=0.5",
]

[project.urls]
Homepage = "https://github.com/ericovis/deal_with_it"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "responses>=0.25",
    "fakeredis>=2.26",
    "ruff>=0.9",
]
# `uv sync --group e2e`, then `uv run playwright install chromium`.
e2e = [
    "playwright>=1.49",
    "pytest-playwright>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "faces: needs the optional detector stack (install the 'worker' extra)",
    "e2e: drives a real browser against a real server (install the 'e2e' group)",
    "expects_404: navigates to a missing page on purpose, so the browser logs its status",
]
filterwarnings = [
    "error::DeprecationWarning:src.*",
    "ignore:pkg_resources is deprecated:UserWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/worker.py"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"src/ui.py" = ["N802"]
